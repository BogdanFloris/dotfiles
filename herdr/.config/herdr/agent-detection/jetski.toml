id = "jetski"
version = "2026.07.31.1"
min_engine_version = 1
updated_at = "2026-07-31T00:00:00Z"
aliases = ["jetski", "cli", "gemini"]

[[rules]]
id = "permission_or_question_prompt"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["requesting permission for:"] },
  { contains = ["do you want to proceed?"] },
  { contains = ["tab amend", "edit command"] },
  { contains = ["Select an option:"] },
  { contains = ["Proceed [y/N]?"] },
  { contains = ["Approve command?"] },
  { contains = ["waiting for user confirmation"] },
]

[[rules]]
id = "spinner_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
line_regex = ['^\s*[\u2800-\u28FF]+\s+\p{Alphabetic}+\w*ing\b']

[[rules]]
id = "background_tasks_working"
state = "working"
priority = 90
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['(?i)·\s*[1-9][0-9]*\s+task']
