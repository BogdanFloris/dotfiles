onboarding = false
[theme]
name = "gruvbox"

[keys]
prefix = "ctrl+a"

# --- Direct addressing -------------------------------------------------------
# Bare numbers are tabs, within the focused workspace. This is also herdr's
# default; pinned explicitly so it can't drift. Workspaces are reached with
# prefix+o or the brackets, not numbers.
switch_tab = "prefix+1..9"

# Agent rows in sidebar order (priority sort), so 1 is whatever needs attention.
# alt keeps these clear of the tab numbers.
focus_agent = "prefix+alt+1..9"

# No last_pane binding: herdr has no last-*workspace* toggle, and the pane-level
# one isn't what's wanted here.
previous_workspace = "prefix+["
next_workspace = "prefix+]"

next_agent = "prefix+u"
previous_agent = "prefix+shift+u"

# --- Fuzzy picker ------------------------------------------------------------
# The primary way across workspaces: agents by title, workspaces, and zoxide
# dirs not yet open.
[[keys.command]]
key = "prefix+o"
type = "popup"
command = "sh -c '$HOME/dotfiles/scripts/herdr-jump'"
width = "85%"
height = "75%"
description = "jump to anything"

# --- Pane navigation (shared with vim) ---------------------------------------
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# --- jj workspaces -----------------------------------------------------------
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "nathanflurry.jj-workspace.new-tab"
description = "new jj workspace (tab)"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "nathanflurry.jj-workspace.new"
description = "new jj workspace (herdr workspace)"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "nathanflurry.jj-workspace.remove"
description = "remove current jj workspace"

[ui.sound]
enabled = true

[ui.toast]
delivery = "terminal"
delay_seconds = 3

[ui]
show_agent_labels_on_pane_borders = false
prompt_new_tab_name = false
agent_panel_sort = "priority"
