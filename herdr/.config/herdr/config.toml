onboarding = false
[theme]
name = "gruvbox"

[keys]
prefix = "ctrl+a"

resize_up = "k"
resize_down = "j"
resize_left = "h"
resize_right = "l"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = false
