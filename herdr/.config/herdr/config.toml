onboarding = false
[theme]
name = "gruvbox"

[keys]
prefix = "ctrl+a"
switch_tab = "prefix+1..9"
focus_agent = "prefix+alt+1..9"
previous_workspace = "prefix+["
next_workspace = "prefix+]"
next_agent = "prefix+u"
previous_agent = "prefix+shift+u"

# --- Fuzzy picker ------------------------------------------------------------
[[keys.command]]
key = "prefix+o"
type = "popup"
command = "sh -c '$HOME/dotfiles/scripts/herdr-jump'"
width = "85%"
height = "75%"
description = "jump to anything"

# --- Pane navigation (shared with vim) ---------------------------------------
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[ui.sound]
enabled = true

[ui.toast]
delivery = "terminal"
delay_seconds = 3

[ui]
show_agent_labels_on_pane_borders = false
prompt_new_tab_name = false
agent_panel_sort = "priority"
