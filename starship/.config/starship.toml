"$schema" = 'https://starship.rs/config-schema.json'
command_timeout = 30

format = """
$username\
$hostname\
${env_var.STARSHIP_G3_CLIENT}\
$directory\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[directory]
# Repo-root lookup costs ~1.5s per prompt on CitC
truncate_to_repo = false

# Set by a chpwd hook in ~/.zshrc when inside a CitC client
[env_var.STARSHIP_G3_CLIENT]
format = "[$env_value]($style) "
style = "bold blue"

[username]
disabled = true

[hostname]

disabled = true
